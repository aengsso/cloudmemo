<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>클라우드 메모</title>
<!--WEB-ONLY-START-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="메모">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)">
<!--WEB-ONLY-END-->
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div id="app" class="show-list">
  <aside id="sidebar">
    <header class="side-head">
      <h1>메모</h1>
      <div class="head-btns">
        <button id="btn-settings" class="icon-btn" title="화면 설정 (테마·색)" aria-label="화면 설정">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="8" cy="9" r="1.6" fill="currentColor"/><circle cx="12.5" cy="6.8" r="1.6" fill="currentColor"/><circle cx="16.6" cy="9.6" r="1.6" fill="currentColor"/><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.3 0 2-.8 2-1.8 0-1.5-1.4-1.6-1.4-3 0-1 .8-1.7 1.8-1.7h2.2a3.9 3.9 0 0 0 3.9-3.9C20.5 6.6 16.7 3.5 12 3.5z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-new" class="icon-btn" title="새 메모 (Ctrl+N)" aria-label="새 메모">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </header>
    <div class="seg tabs" id="tabs" role="tablist" aria-label="메모 / 일기">
      <button data-tab="memo" role="tab">메모</button><button data-tab="diary" role="tab">일기</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="검색" autocomplete="off">
    </div>
    <div id="folders" role="tablist" aria-label="폴더"></div>
    <ul id="list" role="listbox" aria-label="메모 목록"></ul>
    <div id="diary" aria-label="일기">
      <div class="cal-head">
        <span id="cal-title"></span>
        <button id="cal-today" class="text-btn">오늘</button>
        <button id="cal-prev" class="icon-btn" aria-label="이전 달">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button id="cal-next" class="icon-btn" aria-label="다음 달">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <ul class="diary-list" id="diary-list" aria-label="이 달의 일기"></ul>
    </div>
    <footer id="sync-bar">
      <span id="sync-dot"></span>
      <span id="sync-text">…</span>
      <button id="btn-sync" class="text-btn" hidden>지금 동기화</button>
      <button id="btn-login" class="text-btn primary" hidden>구글 드라이브 연결</button>
      <button id="btn-logout" class="text-btn" hidden>연결 해제</button>
    </footer>
  </aside>
  <main id="editor-pane">
    <header class="editor-head" id="editor-head">
      <button id="btn-back" class="icon-btn back" aria-label="목록으로">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <span id="editor-meta"></span>
      <button id="btn-folder" class="icon-btn" title="폴더로 옮기기" aria-label="폴더로 옮기기">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-font" class="icon-btn" title="화면 글자 크기 (이 기기)" aria-label="화면 글자 크기">
        <svg viewBox="0 0 24 24" width="21" height="21"><path d="M3 19l5-13 5 13M4.8 14.5h6.4M14.5 19l3.5-9 3.5 9M15.6 16.3h4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button id="btn-pin" class="icon-btn" title="고정" aria-label="고정" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 3.5h6l-1 6 3.5 3.5v1.5h-11V13L10 9.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 14.5V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button id="btn-delete" class="icon-btn" title="삭제" aria-label="삭제">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </header>
    <div id="fmt-bar" role="toolbar" aria-label="서식">
      <button id="f-size" class="fmt wide" title="글자 크기 (선택한 부분)" aria-label="글자 크기" aria-haspopup="menu">
        <span class="size-ico">가<small>가</small></span>
        <svg viewBox="0 0 24 24" width="12" height="12"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button id="f-bold" class="fmt" title="굵게 (Ctrl+B)" aria-label="굵게" aria-pressed="false"><b>B</b></button>
      <button id="f-italic" class="fmt" title="기울임 (Ctrl+I)" aria-label="기울임" aria-pressed="false"><i class="ital">I</i></button>
      <button id="f-under" class="fmt" title="밑줄 (Ctrl+U)" aria-label="밑줄" aria-pressed="false"><u>U</u></button>
      <button id="f-color" class="fmt wide" title="글자 색" aria-label="글자 색" aria-haspopup="menu">
        <span class="color-ico">A<i id="color-bar"></i></span>
        <svg viewBox="0 0 24 24" width="12" height="12"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button id="f-hl" class="fmt wide" title="형광펜" aria-label="형광펜" aria-haspopup="menu">
        <span class="hl-ico"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M14.5 4.5l5 5-8 8H6.5v-5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M12 7l5 5" stroke="currentColor" stroke-width="1.8"/></svg><i id="hl-bar"></i></span>
        <svg viewBox="0 0 24 24" width="12" height="12"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button id="f-clear" class="fmt" title="서식 지우기" aria-label="서식 지우기">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M5 6h11M10.5 6l-3 13M14 14l6 6M20 14l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button id="f-hr" class="fmt" title="굵은 구분선 (--- 입력 후 Enter)" aria-label="구분선">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 12h18" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M7 6.5h10M7 17.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".45"/></svg>
      </button>
      <span class="sep"></span>
      <button id="btn-check" class="fmt" title="체크리스트 (Ctrl+Shift+L)" aria-label="체크리스트">
        <svg viewBox="0 0 24 24" width="19" height="19"><rect x="3.5" y="3.5" width="17" height="17" rx="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 12.2l2.7 2.7L16 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>
    <div id="editor" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="메모 내용"></div>
    <div id="empty-state">메모를 선택하거나 새로 만들어.</div>
  </main>
</div>
<div id="menu" role="menu" hidden></div>
<div id="settings" class="overlay" hidden>
  <div class="sheet settings" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <h2 id="set-title">화면 설정</h2>
    <div class="set-label">모드</div>
    <div class="seg" id="set-mode" role="radiogroup" aria-label="모드">
      <button data-mode="" role="radio">자동</button><button data-mode="light" role="radio">라이트</button><button data-mode="dark" role="radio">다크</button>
    </div>
    <div class="set-label">테마</div>
    <div class="themes" id="set-theme" role="radiogroup" aria-label="테마"></div>
    <div class="set-label">강조색</div>
    <div class="accents" id="set-accent" role="radiogroup" aria-label="강조색"></div>
    <p class="set-note">이 기기에만 저장돼. 메모 내용에는 영향 없어.</p>
    <div class="sheet-btns"><button type="button" class="text-btn primary" id="set-close">완료</button></div>
  </div>
</div>
<div id="modal" class="overlay" hidden>
  <form id="pw-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="pw-title" autocomplete="off">
    <h2 id="pw-title"></h2>
    <p id="pw-note"></p>
    <input id="pw1" type="password" autocomplete="off" placeholder="비밀번호" aria-label="비밀번호">
    <input id="pw2" type="password" autocomplete="off" placeholder="비밀번호 확인" aria-label="비밀번호 확인">
    <p id="pw-err" role="alert"></p>
    <div class="sheet-btns">
      <button type="button" id="pw-cancel" class="text-btn">취소</button>
      <button type="submit" class="text-btn primary">확인</button>
    </div>
  </form>
</div>
<!--WEB-ONLY-START-->
<script src="config.js?v=8"></script>
<script src="api-web.js?v=8"></script>
<!--WEB-ONLY-END-->
<script src="app.js?v=8"></script>
</body>
</html>
